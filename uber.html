<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis viajes en Uber</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    :root { --green: #06C167; }
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 880px; margin: 0 auto; padding: 32px 24px 64px; }
    .back { color: #a6a6a6; text-decoration: none; font-size: 14px; }
    .back:hover { color: #fff; }
    .eyebrow { margin: 48px 0 8px; color: var(--green); font-size: 14px; font-weight: 500; letter-spacing: .02em; }
    h1 { margin: 0 0 40px; font-size: clamp(32px, 6vw, 52px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }

    .stats { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; margin-bottom: 40px; }
    .stat { border-radius: 16px; padding: 24px; background: #141414; }
    .stat.main { background: var(--green); color: #000; }
    .num { font-size: 64px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; }
    .stat:not(.main) .num { font-size: 44px; color: var(--green); }
    .label { margin-top: 10px; font-size: 15px; line-height: 1.4; }
    .stat:not(.main) .label { color: #a6a6a6; }

    .card { background: #0d0d0d; border: 1px solid #222; border-radius: 16px; padding: 24px 16px 12px; }
    .chart { display: block; width: 100%; height: auto; color: #8a8a8a; font-family: inherit; font-size: 13px; }
    .chart .domain { stroke: #444; }
    .chart .tick line { stroke: #444; }
    .bar { fill: var(--green); transition: fill .15s; cursor: default; }
    .bar:hover { fill: #5ee39b; }
    .val { fill: #cfcfcf; font-size: 14px; font-weight: 500; }

    .note { margin-top: 16px; color: #6f6f6f; font-size: 13px; line-height: 1.5; }
    @media (max-width: 600px) { .stats { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← Volver a mis trabajos</a>

    <p class="eyebrow">Mis viajes · 2018–2026</p>
    <h1>Mis viajes en Uber por año</h1>

    <div class="stats">
      <div class="stat main">
        <div class="num">3.361 km</div>
        <div class="label"><strong>recorridos en Uber.</strong> Es más o menos como ir de Buenos Aires a Bariloche… ¡dos veces!</div>
      </div>
      <div class="stat">
        <div class="num">176
